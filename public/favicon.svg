      <path d="M 42 33 C 32 33 24 38 24 46 C 24 54 32 58 40 60 C 49 63 56 66 56 75 C 56 84 46 90 35 90 C 24 90 16 84 12 76 L 24 68 C 26 73 30 77 36 77 C 41 77 44 74 44 70 C 44 65 37 62 29 59 C 19 56 12 51 12 42 C 12 30 24 23 38 23 C 48 23 55 28 59 34 L 47 43 C 45 37 40 33 34 33 Z" fill="#169DB1"/>
