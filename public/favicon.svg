<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coastalOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D6E6E" />
      <stop offset="100%" stop-color="#08383B" />
    </linearGradient>
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A29" />
      <stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>
    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="pawShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="32" cy="32" r="30" fill="url(#coastalOcean)" />

  <!-- Subtle Outer Accent Ring -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#mintGlow)" stroke-width="1.5" opacity="0.6" />

  <!-- Warm Sun / Play Accent Dot -->
  <circle cx="48" cy="16" r="5" fill="url(#warmAccent)" />

  <!-- Pure White Paw Print with Crisp Geometry -->
  <g fill="#FFFFFF" filter="url(#pawShadow)">
    <!-- Toe 1 -->
    <ellipse cx="19" cy="24" rx="4.5" ry="6.5" transform="rotate(-20 19 24)" />
    <!-- Toe 2 -->
    <ellipse cx="27.5" cy="17" rx="5" ry="7.5" transform="rotate(-6 27.5 17)" />
    <!-- Toe 3 -->
    <ellipse cx="36.5" cy="17" rx="5" ry="7.5" transform="rotate(6 36.5 17)" />
    <!-- Toe 4 -->
    <ellipse cx="45" cy="24" rx="4.5" ry="6.5" transform="rotate(20 45 24)" />

    <!-- Main Central Pad -->
    <path d="M 22 36 C 18 41 20.5 49 28 52 C 30.5 53 33.5 53 36 52 C 43.5 49 46 41 42 36 C 38.5 31.5 34 34.5 32 34.5 C 30 34.5 25.5 31.5 22 36 Z" />
  </g>

  <!-- Sparkle Star in Bright Seafoam -->
  <path d="M 14 14 Q 14 18 10 18 Q 14 18 14 22 Q 14 18 18 18 Q 14 18 14 14 Z" fill="url(#mintGlow)" />
</svg>
